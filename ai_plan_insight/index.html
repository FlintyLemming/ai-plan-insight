<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f7f4">
<title>AI Plan Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking: if Google Fonts is unreachable the page renders at
     once with the system fallbacks below instead of waiting on a timeout. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
  /* Design tokens — warm cream editorial system. Cursor Orange (--primary)
     stays scarce: the wordmark mark only. Depth is hairlines, never shadows. */
  :root {
    --primary: #f54e00;
    --primary-active: #d04200;
    --canvas: #f7f7f4;
    --canvas-soft: #fafaf7;
    --surface-card: #ffffff;
    --surface-strong: #e6e5e0;
    --hairline: #e6e5e0;
    --hairline-soft: #efeee8;
    --hairline-strong: #cfcdc4;
    --ink: #26251e;
    --body: #5a5852;
    --muted: #807d72;
    --muted-soft: #a09c92;
    --on-primary: #ffffff;
    --success: #1f8a65;
    --warning: #b7791f;
    --warning-soft: #fbf5ea;
    --warning-line: #ecd9b4;
    --error: #cf2d56;
    --error-soft: #fcf0f3;
    --error-line: #f1cfd8;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    --rounded-xs: 4px;
    --rounded-sm: 6px;
    --rounded-md: 8px;
    --rounded-lg: 12px;
    --rounded-pill: 9999px;
    --gutter: 16px;
    /* Width of the shared page column (nav, header, content). Wide screens
       snap it to whole 364px balance-card columns further down, so every
       block on the page shares the card grid's left AND right edge. */
    --shell-max: 100%;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    background: var(--canvas);
    color: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  button, select { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .shell {
    width: 100%;
    max-width: var(--shell-max);
    margin: 0 auto;
    padding-left: var(--gutter);
    padding-right: var(--gutter);
  }

  /* ---- Top navigation: wordmark · view menu · admin ---- */
  .top-nav {
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .top-nav-inner {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    column-gap: 32px;
  }
  .wordmark {
    order: 1;
    height: 56px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .wordmark-mark {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--primary);
    flex: 0 0 auto;
  }
  .admin-entry {
    order: 2;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    background: var(--surface-card);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--rounded-md);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
  }
  .admin-entry:hover { border-color: var(--muted-soft); }
  .admin-entry:active { background: var(--canvas-soft); }
  /* The two views are the site's primary menu. On phones the menu drops to
     its own row under the wordmark; from 640px it sits inline beside it. */
  .tab-bar {
    order: 3;
    width: 100%;
    height: 44px;
    display: flex;
    align-items: stretch;
    gap: 24px;
    border-top: 1px solid var(--hairline-soft);
  }
  .tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 0;
    padding: 0;
    color: var(--body);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab svg { flex: 0 0 auto; opacity: 0.75; }
  .tab::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); }
  .tab.active svg { opacity: 1; }
  .tab.active::after { background: var(--ink); }

  /* ---- Page header: title left, view controls right ---- */
  .page { flex: 1 0 auto; }
  .page-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
    padding: 32px 0 24px;
  }
  .page-head-main { min-width: 0; }
  h1 {
    font-size: 32px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.8px;
    color: var(--ink);
  }
  .page-lede {
    margin-top: 10px;
    max-width: 36rem;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: 0.08px;
    color: var(--body);
  }
  .updated {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .page-head-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #loading {
    color: var(--muted);
    font-size: 14px;
    padding: 2rem 0;
  }

  /* ---- Balance grid ---- */
  .grid {
    --balance-card-width: 364px;
    --balance-grid-gap: 1rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--balance-grid-gap);
    width: 100%;
    max-width: calc(4 * var(--balance-card-width) + 3 * var(--balance-grid-gap));
    justify-content: start;
  }
  @media (min-width: 388px) {
    .grid { grid-template-columns: repeat(auto-fit, var(--balance-card-width)); }
  }
  .card {
    background: var(--surface-card);
    border-radius: var(--rounded-lg);
    padding: 20px;
    border: 1px solid var(--hairline);
    overflow: hidden;
  }
  @media (min-width: 640px) {
    :root { --gutter: 24px; }
    .wordmark { height: 64px; order: 1; }
    .tab-bar { order: 2; width: auto; height: 64px; gap: 28px; border-top: 0; }
    .admin-entry { order: 3; height: 36px; padding: 0 14px; font-size: 14px; }
    .page-head {
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      padding: 56px 0 32px;
    }
    h1 { font-size: 44px; letter-spacing: -1.3px; }
    .page-lede { font-size: 16px; margin-top: 14px; }
    .grid { --balance-grid-gap: 1.5rem; }
    .card { padding: 24px; }
  }
  /* Snap the page column to whole card columns (364px cards, 24px gaps). */
  @media (min-width: 800px) {
    :root { --shell-max: calc(2 * 364px + 24px + 2 * var(--gutter)); }
  }
  @media (min-width: 1188px) {
    :root { --shell-max: calc(3 * 364px + 2 * 24px + 2 * var(--gutter)); }
  }
  @media (min-width: 1576px) {
    :root { --shell-max: calc(4 * 364px + 3 * 24px + 2 * var(--gutter)); }
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    margin-bottom: 20px;
  }
  .card-title-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink);
    letter-spacing: -0.01em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-type-label {
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-subtitle {
    display: inline-flex;
    align-items: center;
    max-width: 10rem;
    padding: 4px 10px;
    border-radius: var(--rounded-pill);
    background: var(--surface-strong);
    color: var(--ink);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.88px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-header-right {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .view-toggle {
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--hairline-strong);
    background: var(--surface-card);
    color: var(--ink);
    border-radius: var(--rounded-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .view-toggle:hover { border-color: var(--muted-soft); }
  .view-toggle:active { background: var(--canvas-soft); }
  .card-section {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline-soft);
  }

  /* ---- Stat strip (one per view, above the content) ---- */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
    border-radius: var(--rounded-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .stat-strip:empty { display: none; }
  .stat {
    background: var(--surface-card);
    padding: 16px;
    min-width: 0;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.88px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.3px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-value sup { font-size: 0.5em; color: var(--muted); margin-left: 2px; }
  .stat-value.is-error { color: var(--error); }
  .stat-value.is-warning { color: var(--warning); }
  .stat-sub {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (min-width: 560px) {
    .stat-value { font-size: 24px; letter-spacing: -0.4px; }
  }
  @media (min-width: 800px) {
    .stat-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 24px; }
    .stat { padding: 20px 24px; }
    .stat-value { font-size: 30px; letter-spacing: -0.6px; }
    .stat-sub { font-size: 13px; }
  }

  /* ---- GLM history view (inside a card) ---- */
  .history-summary {
    font-size: 14px;
    color: var(--body);
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .history-chart {
    width: 100%;
    height: 180px;
    margin-bottom: 12px;
    position: relative;
    touch-action: pan-y;
  }
  .history-axis { stroke: var(--hairline-strong); stroke-width: 1; }
  .history-grid-line { stroke: var(--hairline-soft); stroke-width: 1; }
  .history-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .history-cursor {
    stroke: var(--muted-soft);
    stroke-width: 1;
    pointer-events: none;
  }
  .history-cursor-dot {
    r: 4;
    stroke: var(--surface-card);
    stroke-width: 2;
    pointer-events: none;
  }
  .history-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-card);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--rounded-md);
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink);
    transform: translate(-50%, calc(-100% - 8px));
    white-space: nowrap;
    z-index: 10;
    display: none;
  }
  .history-tooltip-date {
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .history-tooltip-row {
    display: flex;
    justify-content: space-between;
    gap: 0.85rem;
    align-items: center;
    padding: 2px 0;
  }
  .history-tooltip-model {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--body);
    font-family: var(--font-mono);
  }
  .history-tooltip-tokens {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .history-tooltip-empty { color: var(--muted); }
  .history-model-row {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 13px;
    padding: 6px 0;
    color: var(--body);
    border-bottom: 1px solid var(--hairline-soft);
    font-variant-numeric: tabular-nums;
  }
  .history-model-row:last-child { border-bottom: none; }
  .history-model-name {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .history-model-name span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex: 0 0 auto;
  }
  .empty-history {
    color: var(--muted);
    font-size: 14px;
    padding: 1.5rem 0;
    text-align: center;
  }

  /* ---- Limits, bars, balances ---- */
  .limit-row { margin-bottom: 18px; }
  .limit-row:last-child { margin-bottom: 0; }
  .limit-row-spaced { margin-top: 12px; }
  .balance-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 14px;
    line-height: 1.5;
    padding: 7px 0;
    color: var(--body);
    border-bottom: 1px solid var(--hairline-soft);
  }
  .balance-row:last-child { border-bottom: none; }
  .balance-row span:first-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .balance-row span:last-child {
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: right;
    flex-shrink: 0;
  }
  .balance-row .model-code {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
  }
  .limit-label {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 8px;
    color: var(--body);
  }
  .limit-label span:last-child {
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar-bg {
    height: 6px;
    background: var(--hairline-soft);
    border-radius: var(--rounded-pill);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: var(--rounded-pill);
    transition: width 0.5s ease;
  }
  .bar-fill.low { background: var(--success); }
  .bar-fill.mid { background: var(--warning); }
  .bar-fill.high { background: var(--error); }
  .limit-meta {
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
    margin-top: 6px;
  }
  .limit-details { margin-top: 8px; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 13px;
    padding: 3px 0 3px 10px;
    color: var(--body);
    border-left: 1px solid var(--hairline);
    font-variant-numeric: tabular-nums;
  }
  .detail-row span:first-child {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
  }

  /* ---- Error states ---- */
  .error-card {
    grid-column: 1 / -1;
    background: var(--surface-card);
    border-radius: var(--rounded-lg);
    padding: 24px;
    border: 1px solid var(--error-line);
    color: var(--ink);
  }
  .error-card-msg { margin-top: 8px; color: var(--error); font-size: 14px; }
  .card-error {
    border-color: var(--error-line);
  }
  .card-error-msg {
    background: var(--error-soft);
    border: 1px solid var(--error-line);
    border-radius: var(--rounded-md);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--error);
    line-height: 1.5;
    word-break: break-word;
  }
  #instance-errors-banner {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--error);
    padding: 0 2px;
  }

  /* ---- Range control (page header, usage view only) ---- */
  .range-pills {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .range-pill-group {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--hairline-soft);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }
  .range-pill {
    border: 1px solid transparent;
    background: transparent;
    color: var(--body);
    border-radius: var(--rounded-sm);
    height: 30px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .range-pill:hover { color: var(--ink); }
  .range-pill.active {
    border-color: var(--hairline);
    background: var(--surface-card);
    color: var(--ink);
  }

  /* ---- Model usage view ---- */
  .panel {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: var(--rounded-lg);
    padding: 16px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 16px;
  }
  .panel-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink);
  }
  .panel-note {
    font-size: 13px;
    color: var(--muted);
  }
  @media (min-width: 640px) {
    .panel { padding: 24px; }
    .panel-head { margin-bottom: 20px; }
  }
  #usage-chart-view {
    width: 100%;
  }
  #usage-chart-container { position: relative; width: 100%; }
  .usage-axis { stroke: var(--hairline-strong); stroke-width: 1; }
  .usage-grid { stroke: var(--hairline-soft); stroke-width: 1; }
  .usage-axis-text { fill: var(--muted); font-size: 18px; font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  .usage-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline-soft);
    color: var(--body);
    font-size: 13px;
  }
  .usage-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .usage-legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: 0 0 auto;
  }
  .usage-legend-label {
    max-width: 14rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .usage-legend-share {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .usage-hover { cursor: pointer; }
  /* Focus mode: hovering a legend item or a table row dims every model but
     one, across the bars and the legend at once. Pointer devices only —
     there is no hover on touch, so the rules must not stick there. */
  @media (hover: hover) {
    /* Dim fill has to stay clearly lighter than USAGE_OTHER_COLOR (#a09c92),
       or focusing a model outside the top 8 lights up an "其他" band nobody
       can pick out from the bar around it. */
    #usage-svg.has-active rect[data-model]:not(.is-active) { fill: #ecebe5; }
    .usage-legend.has-active .usage-legend-item:not(.is-active) { opacity: 0.3; }
    .usage-legend-item { cursor: default; transition: opacity 0.12s ease; }
  }
  .stale-alert {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--warning-soft);
    border: 1px solid var(--warning-line);
    border-radius: var(--rounded-lg);
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 14px;
    color: var(--ink);
  }
  .stale-alert-text {
    flex: 1;
    line-height: 1.5;
  }
  .stale-alert-text .stale-last-seen {

<script>
const TIME_UNIT_LABELS = {
  second: '秒', minute: '分钟', hour: '小时',
  day: '天', week: '周', month: '月', year: '年',
  tokens_limit: '模型调用',
};

const TAB_KEY = 'ai-plan-insight:tab';
// The admin page's menu links here as /?tab=…; honour it once, then drop it
// from the address bar so a later reload follows the remembered tab again.
const urlTab = new URLSearchParams(location.search).get('tab');
if (urlTab) history.replaceState(null, '', location.pathname);
let activeTab = urlTab || localStorage.getItem(TAB_KEY) || 'balance';

async function initTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => applyTab(btn.getAttribute('data-tab')));
  });
  applyTab(activeTab);
}

const TAB_COPY = {
  balance: { title: '订阅余额', lede: '各 AI Coding Plan 的额度、余额与重置时间。' },
  usage: { title: '模型用量', lede: '按模型汇总的 Token 消耗与等额价值。' },
};

function applyTab(tab) {
  const validTabs = ['balance', 'usage'];
  if (!validTabs.includes(tab)) tab = 'balance';
  activeTab = tab;
  localStorage.setItem(TAB_KEY, tab);
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.getAttribute('data-tab') === tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('page-title').textContent = TAB_COPY[tab].title;
  document.getElementById('page-lede').textContent = TAB_COPY[tab].lede;
  // Each view owns its header control and stat strip.
  document.getElementById('range-pills').hidden = tab !== 'usage';
  document.getElementById('balance-stats').hidden = tab !== 'balance';
  const grid = document.getElementById('grid');
  const usageView = document.getElementById('usage-chart-view');
  grid.style.display = (tab === 'balance') ? 'grid' : 'none';
  usageView.style.display = (tab === 'usage') ? 'block' : 'none';
  if (tab === 'balance') refreshV2();
  else if (tab === 'usage') refreshUsageChart();
}

initTabs();

async function loadDashboardNotices() {
  let notices;
  try {
    const resp = await fetch('/api/notices');
    notices = await resp.json();
  } catch (e) { return; }
  const box = document.getElementById('notice-banners');
  const parts = [];
  if (notices.migration) {
    const s = notices.migration.summary || {};
    let text = `配置已迁移到数据库：导入了 ${s.instances || 0} 个实例、${s.aliases || 0} 组模型别名。`;
    if (s.backup_ok) text += ` 原 config.json 已备份为 ${s.backup_path}。`;
    else text += ` 原 config.json 备份失败，请手动处理。`;
    text += ' 之后请在管理页维护配置。';
    parts.push(`<div class="notice-banner"><span>${text}</span>
      <button id="dismiss-migration">知道了</button></div>`);
  }
  if (notices.config_file) {
    const c = notices.config_file;
    parts.push(`<div class="notice-banner warn"><span>${
      c.kind === 'parse_error'
        ? `检测到 ${c.path}，但它无法解析：${c.error}`
        : `检测到 ${c.path}，已忽略，配置以数据库为准。`
    }</span></div>`);
  }
  box.innerHTML = parts.join('');
  const btn = document.getElementById('dismiss-migration');
  if (btn) {
    btn.addEventListener('click', async () => {
      await fetch('/api/notices/migration/dismiss', { method: 'POST' });
      loadDashboardNotices();
    });
  }
}

loadDashboardNotices();

const RANGE_KEY = 'ai-plan-insight:usage-range';
let usageRange = Number(localStorage.getItem(RANGE_KEY)) || 90;

const TABLE_PAGE_SIZE_KEY = 'ai-plan-insight:usage-table-page-size';
const TABLE_PAGE_SIZES = [10, 20, 50, 100];
let tablePageSize = Number(localStorage.getItem(TABLE_PAGE_SIZE_KEY)) || 10;
if (!TABLE_PAGE_SIZES.includes(tablePageSize)) tablePageSize = 10;
let tableCurrentPage = 1;
let tableAllModels = [];

function applyUsageRange(range) {
  usageRange = range;
  localStorage.setItem(RANGE_KEY, String(range));
  document.querySelectorAll('.range-pill').forEach(btn => {
    btn.classList.toggle('active', Number(btn.getAttribute('data-range')) === range);
  });
  refreshUsageChart();
}

document.querySelectorAll('.range-pill').forEach(btn => {
  btn.addEventListener('click', () => applyUsageRange(Number(btn.getAttribute('data-range'))));
});

applyUsageRange(usageRange);

// Categorical order is the CVD-safety mechanism (validated adjacent pairs on
// white); keep it in sync with USAGE_PALETTE in web.py, which assigns colors.
const USAGE_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const USAGE_OTHER_COLOR = '#a09c92';
const USAGE_OTHER_LABEL = '其他';  // must match USAGE_OTHER_LABEL in web.py
let lastUsageModels = [];  // [{label,color,...}] from the most recent fetch
let lastUsageData = null;  // raw payload from the most recent fetch, for re-render on resize

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// --- Model focus: hovering a legend item or a table row highlights that
// model in the bars and dims the rest. The table lists every model while the
// chart only draws the top 8 plus "其他", so a row outside the top 8 focuses
// the "其他" segment — that is where its tokens actually are.
let activeUsageModel = null;

function chartGroupFor(label) {
  return lastUsageModels.some(m => m.label === label) ? label : USAGE_OTHER_LABEL;
}

function setActiveUsageModel(label) {
  if (activeUsageModel === label) return;
  activeUsageModel = label;
  const svgEl = document.getElementById('usage-svg');
  const legendEl = document.querySelector('.usage-legend');
  [svgEl, legendEl].forEach(root => {
    if (!root) return;
    root.classList.toggle('has-active', label !== null);
    root.querySelectorAll('[data-model]').forEach(el => {
      el.classList.toggle('is-active', el.getAttribute('data-model') === label);
    });
  });
}

// Delegated once on the two containers, which outlive every re-render, so
// paging the table or resizing the chart never needs a re-bind.
['usage-chart-container', 'usage-table-container'].forEach(id => {
  const host = document.getElementById(id);
  if (!host) return;
  host.addEventListener('mouseover', (e) => {
    const target = e.target.closest('.usage-legend-item, .usage-table tbody tr');
    setActiveUsageModel(target ? target.getAttribute('data-model') : null);
  });
  host.addEventListener('mouseleave', () => setActiveUsageModel(null));
});

function formatUsageDate(label) {
  const parts = String(label || '').split('-');
  if (parts.length === 3) return `${parts[1]}月${parts[2]}日`;
  return String(label);
}

function renderUsageChart(data) {
  const container = document.getElementById('usage-chart-container');
  const tableContainer = document.getElementById('usage-table-container');
  if (data) lastUsageData = data;
  tableAllModels = (data && Array.isArray(data.all_models)) ? data.all_models : [];
  tableCurrentPage = 1;
  if (!data || !data.days || data.days.length === 0) {
    container.innerHTML = '<div class="empty-usage">暂无用量数据</div>';
    if (tableContainer) tableContainer.innerHTML = '';
    renderUsageStats(null);
    return;
  }

  const days = data.days;
  const modelSummary = data.models;
  lastUsageModels = modelSummary;

  // Calculate grand total across all days and models
  const grandTotal = modelSummary.reduce((sum, m) => sum + (m.grand_total || 0), 0);
  // USD equivalent: sum priced models; flag partial when any token-bearing
  // model was unpriced (cost_usd null) or any model reports cost_partial.
  let grandCost = 0, costPartial = false, hasAnyCost = false;
  modelSummary.forEach(m => {
    if (m.cost_usd != null) { grandCost += m.cost_usd; hasAnyCost = true; }
    else if (m.grand_total) costPartial = true;
    if (m.cost_partial) costPartial = true;
  });
  const colorByLabel = {};
  modelSummary.forEach(m => { colorByLabel[m.label] = m.color; });

  const W = 1000, H = 400;
  // On mobile the Y-axis labels are scaled up (font-size 18px in SVG units),
  // so widen the left padding to keep "1.25 M" from colliding with the axis.
  const isMobile = window.innerWidth < 640;
  const padL = isMobile ? 132 : 86, padR = 16, padT = 16, padB = 44;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const baseY = H - padB;

  const dailyTotals = days.map(d => d.models.reduce((s, m) => s + m.total, 0));
  const maxTotal = Math.max(...dailyTotals, 1);

  const peakIdx = dailyTotals.indexOf(Math.max(...dailyTotals));
  renderUsageStats({
    grandTotal, grandCost, costPartial, hasAnyCost,
    dayCount: days.length,
    peakDate: peakIdx >= 0 ? days[peakIdx].date : null,
    peakTotal: peakIdx >= 0 ? dailyTotals[peakIdx] : 0,
    modelCount: tableAllModels.length,
    coloredCount: modelSummary.filter(m => m.label !== USAGE_OTHER_LABEL).length,
  });

  const n = days.length;
  const slot = plotW / n;
  // The SVG scales with its container, so convert on-screen px into viewBox
  // units: bars cap at 24px wide, stacked segments sit 2px apart, and the
  // data-end gets a 4px rounded cap — at every viewport width.
  const unitPerPx = W / Math.max(1, container.clientWidth || W);
  const barW = Math.min(slot * 0.62, 24 * unitPerPx);
  const segGap = 2 * unitPerPx;
  const capR = Math.min(4 * unitPerPx, barW / 2);

  // Y gridlines + value labels
  const steps = 4;
  let gridSvg = '';
  for (let i = 0; i <= steps; i++) {
    const val = (maxTotal / steps) * i;
    const y = baseY - (val / maxTotal) * plotH;
    gridSvg += `<line class="usage-grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`;
    gridSvg += `<text class="usage-axis-text" x="${padL - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end">${formatTokens(val)}</text>`;
  }

  // Stacked bars + hover capture + X labels
  const labelEvery = n > 60 ? 7 : (n > 10 ? 3 : 1);
  let barsSvg = '';
  let clipDefs = '';
  days.forEach((day, idx) => {
    const cx = padL + slot * idx + slot / 2;
    const x = cx - barW / 2;
    let cursor = baseY;
    const present = modelSummary
      .map(m => {
        const dayModel = day.models.find(dm => dm.label === m.label);
        return dayModel ? { ...dayModel, color: m.color } : null;
      })
      .filter(Boolean);
    // Round only the top of the whole stack: clip it to a rounded rect whose
    // lower corners hang below the baseline, so the bar stays square there.
    const stackH = (dailyTotals[idx] / maxTotal) * plotH;
    const clipId = `usage-bar-clip-${idx}`;
    if (stackH > 0) {
      clipDefs += `<clipPath id="${clipId}"><rect x="${x.toFixed(1)}" y="${(baseY - stackH).toFixed(1)}" width="${barW.toFixed(1)}" height="${(stackH + capR).toFixed(1)}" rx="${capR.toFixed(1)}"/></clipPath>`;
      barsSvg += `<g clip-path="url(#${clipId})">`;
    }
    present.forEach((m, segIdx) => {
      const h = (m.total / maxTotal) * plotH;
      const y = cursor - h;
      const segmentColor = m.color || colorByLabel[m.label] || USAGE_OTHER_COLOR;
      // Every segment above the first gives up its bottom edge to a surface gap.
      const drawH = segIdx === 0 ? h : Math.max(0, h - segGap);
      barsSvg += `<rect data-model="${escapeHtml(m.label)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${drawH.toFixed(1)}" fill="${segmentColor}"/>`;
      cursor = y;
    });
    if (stackH > 0) barsSvg += '</g>';
    barsSvg += `<rect class="usage-hover" data-idx="${idx}" x="${(padL + slot * idx).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
    if (idx % labelEvery === 0) {
      barsSvg += `<text class="usage-axis-text" x="${cx.toFixed(1)}" y="${(baseY + 18).toFixed(1)}" text-anchor="middle">${formatUsageDate(day.date)}</text>`;
    }
  });

  // Legend below the chart, kept outside the SVG so it never covers bars.
  let legendHtml = '';
  modelSummary.forEach((m, i) => {
    legendHtml += `<div class="usage-legend-item" data-model="${escapeHtml(m.label)}">
      <span class="usage-legend-swatch" style="background:${m.color}"></span>
      <span class="usage-legend-label">${escapeHtml(m.label)}</span>
      <span class="usage-legend-share">${Number(m.share_pct || 0).toFixed(1)}%</span>
    </div>`;
  });

  container.innerHTML = `
<svg id="usage-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;touch-action:pan-y;">
  <defs>${clipDefs}</defs>
  ${gridSvg}
  ${barsSvg}
  <line class="usage-axis" x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}"/>
</svg>
<div class="usage-legend">${legendHtml}</div>
<div class="usage-tooltip" id="usage-tooltip"></div>`;
  // The legend and bars just got replaced, so any focus state is gone with them.
  activeUsageModel = null;

  // Tooltip wiring: show per-model rows for a given day index.
  const svgEl = document.getElementById('usage-svg');
  const tooltip = document.getElementById('usage-tooltip');

  function showUsageTooltipForDay(idx, clientX, clientY) {
    if (idx < 0 || idx >= days.length) { hideUsageTooltip(); return; }
    const day = days[idx];
    const rows = day.models
      .filter(m => m.total > 0)
      .map(m => `<div class="usage-tooltip-row">
          <span class="usage-tooltip-model"><span class="history-dot" style="background:${colorByLabel[m.label] || USAGE_OTHER_COLOR}"></span><span>${escapeHtml(m.label)}</span></span>
          <span class="usage-tooltip-tokens">输入 ${formatTokens(m.input_tokens)} · 输出 ${formatTokens(m.output_tokens)} · 缓存读 ${formatTokens(m.cache_read_tokens || 0)} · 缓存写 ${formatTokens(m.cache_write_tokens || 0)} · 推理 ${formatTokens(m.reasoning_tokens || 0)} · 共 ${formatTokens(m.total)}</span>
        </div>`).join('');
    // Days with no usage still get a slot on the axis, so the tooltip has to
    // say so instead of showing a bare date with no rows under it.
    const body = rows || '<div class="usage-tooltip-row"><span class="usage-tooltip-tokens">无用量</span></div>';
    tooltip.innerHTML = `<div class="usage-tooltip-date">${formatUsageDate(day.date)}</div>${body}`;
    const cr = container.getBoundingClientRect();
    let left = clientX - cr.left;
    // Clamp tooltip within container horizontally on narrow screens
    const tooltipWidth = tooltip.offsetWidth || 260;
    left = Math.max(8, Math.min(left, cr.width - tooltipWidth / 2 - 8));
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${clientY - cr.top}px`;
    tooltip.style.display = 'block';
  }
  function hideUsageTooltip() { tooltip.style.display = 'none'; }

  // Helper: convert clientX to nearest day index using SVG coordinates
  function clientXToDayIdx(clientX) {
    const pt = svgEl.createSVGPoint();
    pt.x = clientX; pt.y = 0;
    const ctm = svgEl.getScreenCTM();
    if (!ctm) return -1;
    const svgPt = pt.matrixTransform(ctm.inverse());
    const mx = svgPt.x;
    if (mx < padL || mx > W - padR) return -1;
    const relX = mx - padL;
    const idx = Math.floor(relX / slot);
    return Math.max(0, Math.min(days.length - 1, idx));
  }

  svgEl.querySelectorAll('.usage-hover').forEach(rect => {
    rect.addEventListener('mousemove', (e) => {
      showUsageTooltipForDay(Number(rect.getAttribute('data-idx')), e.clientX, e.clientY);
    });
    rect.addEventListener('mouseleave', hideUsageTooltip);
  });

  // Touch support for mobile
  svgEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const idx = clientXToDayIdx(t.clientX);
    if (idx >= 0) {
      e.preventDefault();
      showUsageTooltipForDay(idx, t.clientX, t.clientY);
    }
  }, { passive: false });
  svgEl.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const idx = clientXToDayIdx(t.clientX);
    if (idx >= 0) {
      e.preventDefault();
      showUsageTooltipForDay(idx, t.clientX, t.clientY);
    } else {
      hideUsageTooltip();
    }
  }, { passive: false });
  svgEl.addEventListener('touchend', hideUsageTooltip);
  svgEl.addEventListener('touchcancel', hideUsageTooltip);

  // Tap outside the SVG to dismiss (e.g. when tooltip remains after touch end)
  document.addEventListener('touchstart', (e) => {
    if (!svgEl.contains(e.target) && !tooltip.contains(e.target)) {
      hideUsageTooltip();
    }
  }, { passive: true });

  renderUsageTable();
}

function buildPageNumbers(current, total) {
  // Produce a compact list of page numbers with `null` gaps for ellipses.
  const pages = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) pages.push(i);
    return pages;
  }
  pages.push(1);
  const left = Math.max(2, current - 1);
  const right = Math.min(total - 1, current + 1);
  if (left > 2) pages.push(null);
  for (let i = left; i <= right; i++) pages.push(i);
  if (right < total - 1) pages.push(null);
  pages.push(total);
  return pages;
}

function renderUsageTable() {
  const container = document.getElementById('usage-table-container');
  if (!container) return;
  if (!tableAllModels || tableAllModels.length === 0) {
    container.innerHTML = '<div class="usage-table-empty">暂无用量数据</div>';
    return;
  }

  const all = tableAllModels.slice().sort((a, b) => (b.grand_total || 0) - (a.grand_total || 0));
  const total = all.length;
  const size = tablePageSize;
  const totalPages = Math.max(1, Math.ceil(total / size));
  if (tableCurrentPage > totalPages) tableCurrentPage = totalPages;
  if (tableCurrentPage < 1) tableCurrentPage = 1;

  const startIdx = (tableCurrentPage - 1) * size;
  const endIdx = Math.min(startIdx + size, total);
  const pageRows = all.slice(startIdx, endIdx);

  const rowsHtml = pageRows.map(m => {
    const color = m.color || USAGE_OTHER_COLOR;
    return `<tr data-model="${escapeHtml(chartGroupFor(m.label))}">
      <td class="col-model"><span class="usage-table-model-cell">
        <span class="usage-table-swatch" style="background:${color}"></span>
        <span class="usage-table-label">${escapeHtml(m.label)}</span>
      </span></td>
      <td class="num col-detail">${formatTokens(m.input_tokens || 0)}</td>
      <td class="num col-detail">${formatTokens(m.output_tokens || 0)}</td>
      <td class="num col-detail">${formatTokens(m.cache_read_tokens || 0)}</td>
      <td class="num col-detail">${formatTokens(m.cache_write_tokens || 0)}</td>
      <td class="num col-detail">${formatTokens(m.reasoning_tokens || 0)}</td>
      <td class="num col-cost"${m.cost_partial ? ' title="部分原始模型缺少价格数据，此为已知价格部分的合计"' : ''}>${formatUsd(m.cost_usd)}</td>
      <td class="num col-total">${formatTokens(m.grand_total || 0)}</td>
    </tr>`;
  }).join('');

  const pages = buildPageNumbers(tableCurrentPage, totalPages);
  let pageBtnsHtml = '';
  pageBtnsHtml += `<button class="usage-page-btn" data-page="prev" ${tableCurrentPage <= 1 ? 'disabled' : ''}>上一页</button>`;
  pages.forEach(p => {
    if (p === null) {
      pageBtnsHtml += `<span class="usage-page-ellipsis">...</span>`;
    } else {
      pageBtnsHtml += `<button class="usage-page-btn ${p === tableCurrentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
    }
  });
  pageBtnsHtml += `<button class="usage-page-btn" data-page="next" ${tableCurrentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;

  const sizeOptions = TABLE_PAGE_SIZES.map(s =>
    `<option value="${s}" ${s === size ? 'selected' : ''}>${s} / 页</option>`
  ).join('');

  container.innerHTML = `
<div class="usage-table-wrap">
  <div class="usage-table-head">
    <div class="panel-title">模型明细</div>
    <div class="panel-note">按总用量排序 · 悬停一行可在图中定位</div>
  </div>
  <table class="usage-table">
    <thead>
      <tr>
        <th class="col-model">模型名</th>
        <th class="num col-detail">输入 token</th>
        <th class="num col-detail">输出 token</th>
        <th class="num col-detail">缓存读</th>
        <th class="num col-detail">缓存写</th>
        <th class="num col-detail">推理</th>
        <th class="num col-cost">等额价值</th>
        <th class="num col-total">总计</th>
      </tr>
    </thead>
    <tbody>${rowsHtml}</tbody>
  </table>
</div>
<div class="usage-pagination">
  <span class="usage-pagination-info">第 ${startIdx + 1}-${endIdx} 条，共 ${total} 个模型</span>
  <span class="usage-pagination-pages">${pageBtnsHtml}</span>
  <span class="usage-page-size">
    <select class="usage-page-size-select" id="usage-page-size-select">${sizeOptions}</select>
  </span>
</div>`;

  container.querySelectorAll('.usage-page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const target = btn.getAttribute('data-page');
      if (target === 'prev') tableCurrentPage = Math.max(1, tableCurrentPage - 1);
      else if (target === 'next') tableCurrentPage = Math.min(totalPages, tableCurrentPage + 1);
      else tableCurrentPage = Number(target);
      renderUsageTable();
    });
  });
  const sizeSelect = document.getElementById('usage-page-size-select');
  if (sizeSelect) {
    sizeSelect.addEventListener('change', () => {
      const v = Number(sizeSelect.value);
      if (!TABLE_PAGE_SIZES.includes(v)) return;
      tablePageSize = v;
      localStorage.setItem(TABLE_PAGE_SIZE_KEY, String(v));
      tableCurrentPage = 1;
      renderUsageTable();
    });
  }
}

async function refreshUsageChart() {
  const container = document.getElementById('usage-chart-container');
  refreshStaleSources();
  // The global header placeholders are only cleared by the balance-tab
  // refresh paths; when the page loads straight into the usage tab this is
  // the only fetch that runs, so it must resolve them too.
  const statusPromise = fetch('/api/status/v2').then(r => r.json()).catch(() => null);
  try {
    const resp = await fetch(`/api/usage/timeseries?days=${usageRange}`);
    const data = await resp.json();
    renderUsageChart(data);
    document.getElementById('loading').style.display = 'none';
    const status = await statusPromise;
    document.getElementById('updated').textContent =
      status && status.last_updated ? `最后更新：${status.last_updated}` : '';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    if (container) container.innerHTML = `<div class="empty-usage">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function renderStaleSources(sources) {
  const container = document.getElementById('stale-sources-container');
  if (!container) return;
  if (!Array.isArray(sources) || sources.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = sources.map(s => {
    const name = s.label || s.source_id;
    const seen = new Date(s.last_seen);
    const silentDays = Math.max(1, Math.floor((Date.now() - seen.getTime()) / 86400000));
    const seenText = isNaN(seen.getTime()) ? '' :
      `（最后上报：${seen.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })} ${seen.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}）`;
    return `
<div class="stale-alert">
  <span class="stale-alert-text">⚠️ 设备「${escapeHtml(name)}」已超过 ${silentDays} 天未上传数据<span class="stale-last-seen">${seenText}</span>，推送 Agent 可能已停止工作</span>
  <button class="stale-dismiss-btn" data-source-id="${escapeHtml(s.source_id)}">不再提示</button>
</div>`;
  }).join('');

  container.querySelectorAll('.stale-dismiss-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const resp = await fetch(`/api/sources/${encodeURIComponent(btn.getAttribute('data-source-id'))}/dismiss-stale`, { method: 'POST' });
        if (resp.ok) btn.closest('.stale-alert').remove();
        else btn.disabled = false;
      } catch (e) {
        btn.disabled = false;
      }
    });
  });
}

async function refreshStaleSources() {
  try {
    const resp = await fetch('/api/sources/stale');
    renderStaleSources(await resp.json());
  } catch (e) {
    // Liveness alert is best-effort; never disturb the usage page.
    renderStaleSources([]);
  }
}

function formatTimeWindow(l) {

  if (key === 'tokens_limit') return '模型调用';
  const label = TIME_UNIT_LABELS[key] || l.time_unit;
  const window = `${l.duration} ${label}`;

}

function formatReset(resetTime) {
  if (!resetTime) return '';
  const dt = new Date(resetTime);
  const now = new Date();
  const isToday = dt.toDateString() === now.toDateString();
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const isTomorrow = dt.toDateString() === tomorrow.toDateString();

  const time = dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (isToday) return `${time} 重置`;
  if (isTomorrow) return `明天 ${time} 重置`;
  return `${dt.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })} ${time} 重置`;
}

function normalizeSeries(values, length) {
  const source = Array.isArray(values) ? values : [];
  const result = source.slice(0, length).map(v => Number(v || 0));
  while (result.length < length) result.push(0);
  return result;
}

function buildPolyline(values, maxValue, width, height, padX, padY) {
  if (!values.length) return '';
  const plotWidth = width - padX * 2;
  const plotHeight = height - padY * 2;
  return values.map((value, idx) => {
    const x = values.length === 1 ? width / 2 : padX + (idx * plotWidth / (values.length - 1));
    const y = height - padY - ((value / maxValue) * plotHeight);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}

function buildHistoryPointCoords(values, maxValue, width, height, padX, padY) {
  const plotWidth = width - padX * 2;
  const plotHeight = height - padY * 2;
  return values.map((value, idx) => {
    const x = values.length === 1 ? width / 2 : padX + (idx * plotWidth / (values.length - 1));
    const y = height - padY - ((value / maxValue) * plotHeight);
    return { x, y, value, idx };
  });
}

function formatHistoryDate(label) {
  if (!label) return '';
  const parts = String(label).split('-');
  if (parts.length === 3) return `${parts[1]}月${parts[2]}日`;
  return String(label);
}

function showHistoryTooltip(svg, tooltipEl, idx, points, normalizedModels, dates) {
  if (idx < 0 || idx >= dates.length) return;
  const point = points[idx];
  const containerRect = tooltipEl.parentElement.getBoundingClientRect();
  const screenPt = svgToScreen(svg, point.x, point.y);

  const rows = normalizedModels
    .map(m => ({ name: m.model_name, color: m.color, value: m.tokens_usage[idx] }))
    .filter(row => row.value > 0);

  if (!rows.length) {
    tooltipEl.innerHTML = `<div class="history-tooltip-date">${formatHistoryDate(dates[idx])}</div><div class="history-tooltip-row"><span class="history-tooltip-tokens history-tooltip-empty">无用量</span></div>`;
  } else {
    tooltipEl.innerHTML = `<div class="history-tooltip-date">${formatHistoryDate(dates[idx])}</div>`
      + rows.map(row => `
        <div class="history-tooltip-row">
          <span class="history-tooltip-model"><span class="history-dot" style="background:${row.color}"></span><span>${row.name}</span></span>
          <span class="history-tooltip-tokens">${formatTokens(row.value)} tokens</span>
        </div>`).join('');
  }

  tooltipEl.style.left = `${screenPt.x - containerRect.left}px`;
  tooltipEl.style.top = `${screenPt.y - containerRect.top}px`;
  tooltipEl.style.display = 'block';
}

function hideHistoryTooltip(tooltipEl, cursorEl, dotEls) {
  tooltipEl.style.display = 'none';
  if (cursorEl) cursorEl.style.display = 'none';
  if (dotEls) dotEls.forEach(el => el.style.display = 'none');
}

function svgToScreen(svg, x, y) {
  const ctm = svg.getScreenCTM();
  if (!ctm) {
    const rect = svg.getBoundingClientRect();
    const viewBox = svg.viewBox.baseVal;
    return { x: rect.left + (x / viewBox.width) * rect.width, y: rect.top + (y / viewBox.height) * rect.height };
  }
  const pt = svg.createSVGPoint();
  pt.x = x;
  pt.y = y;
  const screen = pt.matrixTransform(ctm);
  return { x: screen.x, y: screen.y };
}

function screenToSvg(svg, clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) {
    const rect = svg.getBoundingClientRect();
    const viewBox = svg.viewBox.baseVal;
    return { x: (clientX - rect.left) * viewBox.width / rect.width, y: (clientY - rect.top) * viewBox.height / rect.height };
  }
  const pt = svg.createSVGPoint();
  pt.x = clientX;
  pt.y = clientY;
  const inv = pt.matrixTransform(ctm.inverse());
  return { x: inv.x, y: inv.y };
}

function handleHistoryHover(event, svg, tooltipEl, cursorEl, dotEls, points, normalizedModels, dates, width, height, padX, padY) {
  const svgPt = screenToSvg(svg, event.clientX, event.clientY);
  const mouseX = svgPt.x;

  if (mouseX < padX || mouseX > width - padX) {
    hideHistoryTooltip(tooltipEl, cursorEl, dotEls);
    return;
  }

  const plotWidth = width - padX * 2;
  const n = points.length;
  let nearestIdx = 0;
  if (n === 1) {
    nearestIdx = 0;
  } else {
    const ratio = (mouseX - padX) / plotWidth;
    nearestIdx = Math.max(0, Math.min(n - 1, Math.round(ratio * (n - 1))));
  }

  const point = points[nearestIdx];

  if (cursorEl) {
    cursorEl.setAttribute('x1', point.x.toFixed(1));
    cursorEl.setAttribute('x2', point.x.toFixed(1));
    cursorEl.style.display = 'block';
  }
  if (dotEls) {
    dotEls.forEach((el, i) => {
      const model = normalizedModels[i];
      if (!model) { el.style.display = 'none'; return; }
      const v = model.tokens_usage[nearestIdx];
      if (v > 0) {
        const modelY = height - padY - ((v / Math.max(1, ...normalizedModels.flatMap(m => m.tokens_usage))) * (height - padY * 2));
        el.setAttribute('cx', point.x.toFixed(1));
        el.setAttribute('cy', modelY.toFixed(1));
        el.setAttribute('fill', model.color);
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    });
  }

  showHistoryTooltip(svg, tooltipEl, nearestIdx, points, normalizedModels, dates);
}

function renderHistoryView(data) {
  const history = data.history_usage;
  const dates = history && Array.isArray(history.x_time) ? history.x_time : [];
  const models = history && Array.isArray(history.models) ? history.models : [];
  const visibleModels = models.filter(m => Number(m.total_tokens || 0) > 0 || normalizeSeries(m.tokens_usage, dates.length).some(v => v > 0));

  if (!history || !dates.length || !visibleModels.length) {
    return `<div class="empty-history">暂无近 30 天历史数据</div>`;
  }

  const width = 520;
  const height = 180;
  const padX = 24;
  const padY = 18;
  const normalizedModels = visibleModels.map((model, idx) => ({
    ...model,
    color: HISTORY_COLORS[idx % HISTORY_COLORS.length],
    tokens_usage: normalizeSeries(model.tokens_usage, dates.length),
  }));
  const maxValue = Math.max(1, ...normalizedModels.flatMap(m => m.tokens_usage));
  const points = buildHistoryPointCoords(normalizedModels[0].tokens_usage, maxValue, width, height, padX, padY);
  const lines = normalizedModels.map(model => `
    <polyline class="history-line" stroke="${model.color}" points="${buildPolyline(model.tokens_usage, maxValue, width, height, padX, padY)}"></polyline>
  `).join('');
  const dots = normalizedModels.map((model, i) => `<circle class="history-cursor-dot" data-idx="${i}" data-model="${model.model_name}" cx="0" cy="0" r="4" fill="${model.color}" style="display:none"></circle>`).join('');
  const modelRows = normalizedModels.map(model => {
    const calls = model.total_calls === null || model.total_calls === undefined
      ? ''
      : ` · ${formatCount(model.total_calls)} 次`;
    return `<div class="history-model-row">
      <span class="history-model-name"><span class="history-dot" style="background:${model.color}"></span><span>${model.model_name}</span></span>
      <span>${formatTokens(model.total_tokens)} tokens${calls}</span>
    </div>`;
  }).join('');

  const cardKeyForChart = data.instance_id || data.provider;
  const chartId = `history-chart-${cardKeyForChart.replace(/[^a-zA-Z0-9]/g, '')}`;
  return `
    <div class="history-summary">近 30 天：${formatTokens(history.total_tokens)} tokens · ${formatCount(history.total_calls)} 次调用</div>
    <div class="history-chart" data-history-chart="${cardKeyForChart}" id="${chartId}">
      <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="近 30 天模型 token 用量折线图" style="width:100%;height:100%;">
        <line class="history-grid-line" x1="${padX}" y1="${padY}" x2="${width - padX}" y2="${padY}"></line>
        <line class="history-grid-line" x1="${padX}" y1="${height / 2}" x2="${width - padX}" y2="${height / 2}"></line>
        <line class="history-axis" x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}"></line>
        ${lines}
        <line class="history-cursor" data-history-cursor x1="0" y1="${padY}" x2="0" y2="${height - padY}" style="display:none"></line>
        ${dots}
      </svg>
      <div class="history-tooltip" data-history-tooltip></div>
    </div>
    <div>${modelRows}</div>`;
}

function renderHeader(data, subtitle) {
  const cardKey = data.instance_id || data.provider;
  const canToggle = hasHistoryUsage(data);
  const mode = cardViewModes[cardKey] || 'usage';
  const toggle = canToggle
    ? `<button class="view-toggle" data-view-toggle="${cardKey}" onclick="toggleCardView('${cardKey.replace(/'/g, "\\'")}')">${mode === 'history' ? '用量' : '历史'}</button>`
    : '';
  const isV2 = !!data.instance_label;
  const titleHtml = isV2
    ? `<div class="card-title-group"><span class="card-title">${data.type_display_name || ''}</span><span class="card-type-label">${data.instance_label}</span></div>`
    : `<span class="card-title">${data.provider}</span>`;
  const right = subtitle || toggle
    ? `<span class="card-header-right">${subtitle ? `<span class="card-subtitle">${subtitle}</span>` : ''}${toggle}</span>`
    : '';
  return `<div class="card-header">${titleHtml}${right}</div>`;
}

function renderGrid(data) {
  const grid = document.getElementById('grid');
  grid.innerHTML = data.map(renderCard).join('');
  if (activeTab === 'balance') grid.style.display = 'grid';
  bindHistoryCharts();
}

function bindHistoryCharts() {
  const charts = document.querySelectorAll('[data-history-chart]');
  charts.forEach(chartEl => {
    const cardKey = chartEl.getAttribute('data-history-chart');
    const data = latestV2Data.find(d => (d.instance_id || d.provider) === cardKey);
    if (!data || !data.history_usage) return;

    const history = data.history_usage;
    const dates = history.x_time || [];
    const models = history.models || [];
    const visibleModels = models.filter(m => Number(m.total_tokens || 0) > 0 || normalizeSeries(m.tokens_usage, dates.length).some(v => v > 0));
    if (!dates.length || !visibleModels.length) return;

    const width = 520;
    const height = 180;
    const padX = 24;
    const padY = 18;
    const normalizedModels = visibleModels.map((model, idx) => ({
      ...model,
      color: HISTORY_COLORS[idx % HISTORY_COLORS.length],
      tokens_usage: normalizeSeries(model.tokens_usage, dates.length),
    }));
    const maxValue = Math.max(1, ...normalizedModels.flatMap(m => m.tokens_usage));
    const points = buildHistoryPointCoords(normalizedModels[0].tokens_usage, maxValue, width, height, padX, padY);

    const tooltipEl = chartEl.querySelector('[data-history-tooltip]');
    const cursorEl = chartEl.querySelector('[data-history-cursor]');
    const dotEls = Array.from(chartEl.querySelectorAll('.history-cursor-dot'));
    const svg = chartEl.querySelector('svg');

    chartEl.addEventListener('mousemove', (event) => {
      handleHistoryHover(event, svg, tooltipEl, cursorEl, dotEls, points, normalizedModels, dates, width, height, padX, padY);
    });
    chartEl.addEventListener('mouseleave', () => {
      hideHistoryTooltip(tooltipEl, cursorEl, dotEls);
    });

    // Touch support for mobile
    function makeTouchEvent(touch) {
      return { clientX: touch.clientX, clientY: touch.clientY };
    }
    chartEl.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      handleHistoryHover(makeTouchEvent(e.touches[0]), svg, tooltipEl, cursorEl, dotEls, points, normalizedModels, dates, width, height, padX, padY);
    }, { passive: false });
    chartEl.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      handleHistoryHover(makeTouchEvent(e.touches[0]), svg, tooltipEl, cursorEl, dotEls, points, normalizedModels, dates, width, height, padX, padY);
    }, { passive: false });
    chartEl.addEventListener('touchend', () => {
      hideHistoryTooltip(tooltipEl, cursorEl, dotEls);
    });
    chartEl.addEventListener('touchcancel', () => {
      hideHistoryTooltip(tooltipEl, cursorEl, dotEls);
    });
  });
}

function toggleCardView(cardKey) {
  cardViewModes[cardKey] = cardViewModes[cardKey] === 'history' ? 'usage' : 'history';
  renderV2Grid(latestV2Data);
}

function formatTokens(n) {
  return (n / 1000000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
}

function formatUsd(v) {
  if (v === null || v === undefined) return '—';
  if (v > 0 && v < 0.01) return '<$0.01';
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderCard(data) {
  if (data.error) {
    return `
      <div class="card card-error">
        ${renderHeader(data, '')}
        <div class="card-error-msg">${escapeHtml(data.error)}</div>
      </div>`;
  }

  // Card with model_stats (e.g. Codex), or a USD wallet/plan card with no
  // calls yet — both share the "$ balance + usage bar" layout. Without this
  // fallback, an empty-model_stats USD card drops into the rate-limit branch
  // below and renders a "次"-unit bar with a doubled "¥$" balance.
  const usdCard = data.limits.length > 0 && /USD/i.test(data.limits[0].time_unit || '');
  if ((data.model_stats && data.model_stats.length > 0) || usdCard) {
    const limit = data.limits[0];
    const pct = limit ? (parseFloat(limit.used) / parseFloat(limit.limit) * 100) : 0;
    const usedStr = limit ? `$${parseFloat(limit.used).toFixed(2)}` : '';
    const limitStr = limit ? `$${parseFloat(limit.limit).toFixed(2)}` : '';

    const balanceRows = Object.entries(data.balances || {}).map(([key, val]) =>
      `<div class="balance-row"><span>${key}</span><span>${val}</span></div>`
    ).join('');

    const modelRows = [...data.model_stats]
      .sort((a, b) => b.requests - a.requests)
      .slice(0, 3)
      .map(m =>
        `<div class="balance-row">
          <span class="model-code">${escapeHtml(m.model)}</span>
          <span>${formatTokens(m.total_tokens)} tokens · ${m.requests.toLocaleString()} 次</span>
        </div>`
      ).join('');

    return `
      <div class="card">
        ${renderHeader(data, '')}
        ${balanceRows}
        <div class="limit-row limit-row-spaced">
          <div class="limit-label">
            <span>余额使用 (${usedStr} / ${limitStr})</span>
            <span>${pct.toFixed(1)}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill ${barClass(pct)}" style="width:${Math.min(pct, 100)}%"></div>
          </div>
        </div>
        ${modelRows
          ? `<div class="card-section">${modelRows}</div>`
          : ''}
      </div>`;
  }

  // Balance card (no rate limits, just balances)
  if (data.balances && Object.keys(data.balances).length > 0 && !data.limits.length) {
    const subtitle = data.membership_level || data.user_id || '';
    const balanceRows = Object.entries(data.balances).map(([key, val]) => {
      const label = BALANCE_LABELS[key] || key;
      const formattedValue = MONEY_BALANCE_KEYS.has(key) ? `¥${val}` : val;
      return `<div class="balance-row"><span>${label}</span><span>${formattedValue}</span></div>`;
    }).join('');

    return `
      <div class="card">
        ${renderHeader(data, subtitle)}
        ${balanceRows}
      </div>`;
  }

  // Rate-limit card
  const limitsHtml = data.limits.map(l => {
    let pct, pctStr, barWidth;
    if (l.limit_type === 'PERCENT') {
      pct = parseFloat(l.used);
      pctStr = `${pct.toFixed(2)}%`;
      barWidth = Math.min(pct, 100);
    } else {
      pct = l.limit ? Math.round(parseInt(l.used) * 100 / parseInt(l.limit)) : null;
      const usedNum = parseInt(l.used);
      const limitNum = parseInt(l.limit);
      const showCount = limitNum > 200;
      pctStr = pct !== null ? `${pct}%` : `${l.used}/${l.limit}`;
      const countStr = showCount ? `${usedNum.toLocaleString()} / ${limitNum.toLocaleString()} 次` : '';
      if (showCount) pctStr = countStr;
      barWidth = pct !== null ? pct : 0;
    }
    const detailsHtml = l.usage_details.length
      ? l.usage_details.map(d =>
          `<div class="detail-row"><span>${d.model_code}</span><span>${d.usage}</span></div>`
        ).join('')
      : '';

    return `
      <div class="limit-row">
        <div class="limit-label">
          <span>${l.limit_type === 'PERCENT' ? l.time_unit : formatTimeWindow(l)}</span>
          <span>${pctStr}</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill ${barClass(pct || 0)}" style="width:${barWidth}%"></div>
        </div>
        ${l.reset_time ? `<div class="limit-meta">${formatReset(l.reset_time)}</div>` : ''}
        ${detailsHtml ? `<div class="limit-details">${detailsHtml}</div>` : ''}
      </div>`;
  }).join('');

  const subtitle = data.membership_level || data.user_id || '';

  const balancesHtml = data.balances && Object.keys(data.balances).length
    ? '<div class="card-section">'
      + Object.entries(data.balances).map(([key, val]) => {
          const label = BALANCE_LABELS[key] || key;
          const formattedValue = MONEY_BALANCE_KEYS.has(key) ? `¥${val}` : val;
          return `<div class="balance-row"><span>${label}</span><span>${formattedValue}</span></div>`;
        }).join('')
      + '</div>'
    : '';

  const tokenUsageHtml = data.token_usage && data.token_usage.length
    ? '<div class="card-section">'
      + data.token_usage.map(t =>
          `<div class="balance-row"><span>${TOKEN_PERIOD_LABELS[t.period] || t.period}</span><span>${formatTokens(t.total_tokens)} tokens · ${t.total_calls.toLocaleString()} 次</span></div>`
        ).join('')
      + '</div>'
    : '';

  return `
    <div class="card">
      ${renderHeader(data, subtitle)}
      ${hasHistoryUsage(data) && cardViewModes[data.instance_id || data.provider] === 'history'
        ? renderHistoryView(data)
        : `${limitsHtml}${balancesHtml}${tokenUsageHtml}`}
    </div>`;
}

let latestV2Data = [];

function renderInstanceErrors(instanceErrors) {
  const grid = document.getElementById('grid');
  let banner = document.getElementById('instance-errors-banner');
  const keys = Object.keys(instanceErrors || {});
  if (!keys.length) {
    if (banner) banner.remove();
    return;
  }
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'instance-errors-banner';
    grid.prepend(banner);
  }
  banner.textContent = `${keys.length} 个实例配置错误已忽略，详见 /api/status/v2`;
}

async function refreshV2() {
  try {
    const [data, status] = await Promise.all([
      fetch('/api/usage/v2').then(r => r.json()),
      fetch('/api/status/v2').then(r => r.json()),
    ]);
    if (!status.enabled) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div class="empty-usage">尚未配置订阅余额（新）</div>';
      renderBalanceStats([]);
      document.getElementById('loading').style.display = 'none';
      return;
    }
    if (status.config_error) {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div class="error-card"><div class="card-title">配置错误</div><div class="error-card-msg">${escapeHtml(status.config_error)}</div></div>`;
      renderBalanceStats([]);
      document.getElementById('loading').style.display = 'none';
      return;
    }
    latestV2Data = data;
    renderV2Grid(data);
    renderInstanceErrors(status.instance_errors || {});
    document.getElementById('loading').style.display = 'none';
    const updatedEl = document.querySelector('.updated');
    if (updatedEl && status.last_updated) {
      updatedEl.textContent = '最后更新：' + status.last_updated;
    }
  } catch (e) {
    document.getElementById('loading').textContent = `加载失败：${e.message}`;
  }
}

// Share of a limit that is used, in percent, or null when it has no cap.
function limitPercent(l) {
  if (l.limit_type === 'PERCENT') return parseFloat(l.used);
  const used = parseFloat(l.used);
  const cap = parseFloat(l.limit);
  return cap > 0 ? used * 100 / cap : null;
}

function formatResetShort(dt) {
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const time = dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (dt.toDateString() === now.toDateString()) return time;
  if (dt.toDateString() === tomorrow.toDateString()) return `明天 ${time}`;
  return dt.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function renderBalanceStats(data) {
  const el = document.getElementById('balance-stats');
  if (!el) return;
  if (!Array.isArray(data) || data.length === 0) { el.innerHTML = ''; return; }
  const nameOf = d => d.type_display_name || d.provider || d.instance_id;
  const errors = data.filter(d => d.error);
  const healthy = data.filter(d => !d.error);
  const hot = healthy.filter(d => (d.limits || []).some(l => {
    const pct = limitPercent(l);
    return pct !== null && pct >= 85;
  }));
  let next = null;
  healthy.forEach(d => (d.limits || []).forEach(l => {
    if (!l.reset_time) return;
    const t = new Date(l.reset_time).getTime();
    if (isNaN(t) || t < Date.now()) return;
    if (!next || t < next.t) {
      next = { t, name: nameOf(d), window: l.limit_type === 'PERCENT' ? l.time_unit : formatTimeWindow(l) };
    }
  }));
  const names = list => escapeHtml(list.map(nameOf).join('、'));
  el.innerHTML = [
    statCell('订阅实例', String(data.length), `${healthy.length} 个正常获取`),
    statCell('接近上限', String(hot.length),
      hot.length ? names(hot) : '所有额度用量均低于 85%', hot.length ? 'warning' : ''),
    statCell('最近重置', next ? formatResetShort(new Date(next.t)) : '—',
      next ? escapeHtml(`${next.name} · ${next.window}`) : '暂无待重置的额度'),
    statCell('异常', String(errors.length),
      errors.length ? names(errors) : '全部正常', errors.length ? 'error' : ''),
  ].join('');
}

function renderV2Grid(data) {
  const grid = document.getElementById('grid');
  renderBalanceStats(data);
  if (!data || data.length === 0) {
    grid.innerHTML = '<div class="empty-usage">暂无数据</div>';
    return;
  }
  grid.innerHTML = data.map(renderCard).join('');
  if (activeTab === 'balance') grid.style.display = 'grid';
  bindHistoryCharts();
}

setInterval(() => { if (activeTab === 'balance') refreshV2(); }, 60000);
setInterval(() => { if (activeTab === 'usage') refreshUsageChart(); }, 60000);
</script>
